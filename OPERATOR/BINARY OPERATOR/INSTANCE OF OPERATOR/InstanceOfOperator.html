<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>instanceof Operator</title>
  </head>

  <body>
    <h1>JavaScript instanceof Operator</h1>

    <script>
      let numbers = [10, 20, 30];

      let name = "Amol";

      // Check Array
      console.log("numbers instanceof Array:", numbers instanceof Array);

      // Check Object
      console.log("numbers instanceof Object:", numbers instanceof Object);

      // Check String
      console.log("name instanceof String:", name instanceof String);
    </script>
  </body>
</html>
