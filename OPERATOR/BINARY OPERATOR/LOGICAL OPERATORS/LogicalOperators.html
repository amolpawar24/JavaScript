<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logical Operators</title>
  </head>

  <body>
    <h1>JavaScript Logical Operators</h1>

    <script>
      let a = 10;
      let b = 3;

      // Logical AND
      console.log("Logical AND (a > 5 && b < 5):", a > 5 && b < 5);

      // Logical OR
      console.log("Logical OR (a > 20 || b < 5):", a > 20 || b < 5);

      // Logical NOT
      console.log("Logical NOT (!(a > 5)):", !(a > 5));
    </script>
  </body>
</html>
