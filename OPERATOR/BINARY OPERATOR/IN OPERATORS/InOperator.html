<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>in Operator</title>
  </head>

  <body>
    <h1>JavaScript in Operator</h1>

    <script>
      let student = {
        name: "Amol",
        age: 25,
        course: "JavaScript",
      };

      // Check Property
      console.log("name in student:", "name" in student);

      console.log("age in student:", "age" in student);

      console.log("city in student:", "city" in student);
    </script>
  </body>
</html>
