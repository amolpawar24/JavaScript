<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulus Operator</title>
</head>

<body>

    <h1>JavaScript Modulus Operator</h1>

    <script>

        let a = 10;
        let b = 3;

        // Modulus
        console.log("Modulus:", a % b);

    </script>

</body>

</html>
