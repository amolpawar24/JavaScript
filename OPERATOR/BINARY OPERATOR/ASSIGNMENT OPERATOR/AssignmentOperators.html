<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Operators</title>
  </head>

  <body>
    <h1>JavaScript Assignment Operators</h1>

    <script>
      // Assignment
      let a = 10;
      console.log("Assignment (a = 10):", a);

      // Addition Assignment
      a += 5;
      console.log("Addition Assignment (a += 5):", a);

      // Subtraction Assignment
      a -= 3;
      console.log("Subtraction Assignment (a -= 3):", a);

      // Multiplication Assignment
      a *= 2;
      console.log("Multiplication Assignment (a *= 2):", a);

      // Division Assignment
      a /= 4;
      console.log("Division Assignment (a /= 4):", a);

      // Modulus Assignment
      a %= 3;
      console.log("Modulus Assignment (a %= 3):", a);

      // Exponentiation Assignment
      a **= 2;
      console.log("Exponentiation Assignment (a **= 2):", a);
    </script>
  </body>
</html>
