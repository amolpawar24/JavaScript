<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>String Operators</title>
  </head>

  <body>
    <h1>JavaScript String Operators</h1>

    <script>
      let firstName = "Amol";
      let lastName = "Pawar";

      // String Concatenation
      let fullName = firstName + " " + lastName;

      console.log("String Concatenation:", fullName);

      // String Concatenation Assignment
      let message = "Hello";

      message += " Amol";

      console.log("String Concatenation Assignment:", message);
    </script>
  </body>
</html>
