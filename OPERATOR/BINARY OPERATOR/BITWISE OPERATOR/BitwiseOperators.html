<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitwise Operators</title>
  </head>

  <body>
    <h1>JavaScript Bitwise Operators</h1>

    <script>
      let a = 5;
      let b = 3;

      // Bitwise AND
      console.log("Bitwise AND (a & b):", a & b);

      // Bitwise OR
      console.log("Bitwise OR (a | b):", a | b);

      // Bitwise XOR
      console.log("Bitwise XOR (a ^ b):", a ^ b);

      // Bitwise NOT
      console.log("Bitwise NOT (~a):", ~a);

      // Left Shift
      console.log("Left Shift (a << 1):", a << 1);

      // Sign Propagating Right Shift
      console.log("Right Shift (a >> 1):", a >> 1);

      // Zero-Fill Right Shift
      console.log("Unsigned Right Shift (a >>> 1):", a >>> 1);
    </script>
  </body>
</html>
