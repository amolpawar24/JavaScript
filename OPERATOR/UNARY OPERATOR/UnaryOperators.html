<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unary Operators</title>
  </head>

  <body>
    <h1>JavaScript Unary Operators</h1>

    <script>
      let a = 10;

      // Unary Plus
      console.log("Unary Plus (+a):", +a);

      // Unary Minus
      console.log("Unary Minus (-a):", -a);

      // Increment
      console.log("Pre-Increment (++a):", ++a);

      // Decrement
      console.log("Pre-Decrement (--a):", --a);

      // Logical NOT
      console.log("Logical NOT (!true):", !true);

      // Bitwise NOT
      console.log("Bitwise NOT (~a):", ~a);

      // typeof
      console.log("typeof a:", typeof a);

      // delete
      let student = {
        name: "Amol",
        age: 25,
      };

      delete student.age;

      console.log("After delete:", student);
    </script>
  </body>
</html>
