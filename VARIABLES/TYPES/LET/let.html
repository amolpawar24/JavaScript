<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript let</title>
  </head>

  <body>
    <!--! let -->

    <!--? 1. Declaration - Possible -->
    <!--* Variable can be declared without a value. -->
    <script>
      let username;

      console.log(username);
      // Output: undefined

      console.log(typeof username);
      
    </script>

    <!--? 2. Declaration + Initialization - Possible -->
    <!--* Variable can be declared with a value. -->
    <script>
      let age = 25;

      console.log(age);
      // Output: 25
    </script>

    <!--! 3. Re-Declaration - Not Possible -->
    <!--* let does not allow the same variable again. -->
    <script>
      let city = "Pune";

      // let city = "Mumbai";
      // Error: Identifier 'city' has already been declared
    </script>

    <!--? 4. Re-Assignment - Possible -->
    <!--* let allows changing the value of a variable. -->
    <script>
      let salary = 25000;

      salary = "Fourty Thousand";

      console.log(salary);
      // Output: 40000
    </script>

    <!--! 5. Hoisting - Not Accessible Before Declaration -->
    <!--* let is hoisted but remains in the Temporal Dead Zone. -->
    <script>
      // console.log(Hoisting);
      // Error: Cannot access 'Hoisting' before initialization

      let Hoisting = "Hoisting";

      console.log(Hoisting);
      // Output: Amol
    </script>

    <!--? 6. Block Scope - Possible -->
    <!--* let is accessible only inside its block. -->
    <script>
      if (true) {
        let message = "Hello JavaScript";

        console.log(message);
        // Output: Hello JavaScript
      }

      // console.log(message);
      // Error: message is not defined
    </script>

    <!--? 7. Block Scope with for Loop - Possible -->
    <!--* let remains inside the loop block. -->
    <script>
      for (let i = 1; i <= 3; i++) {
        console.log(i);
        // Output: 1 2 3
      }

      // console.log(i);
      // Error: i is not defined
    </script>

    <!--? TIP -->
    <!--* let = Block Scope + TDZ + No Re-Declaration + Re-Assignment -->
  </body>
</html>
