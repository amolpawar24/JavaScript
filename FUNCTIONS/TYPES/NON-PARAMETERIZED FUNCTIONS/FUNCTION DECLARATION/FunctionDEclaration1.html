<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!--! FUNCTION DECLARATION  -->
    <!--todo : abc() is a function declaration  -->
    <!--todo : Function Call Statement : This is responsible to call the Function   -->
    <!--todo : abc is a function reference  -->
    <!--todo : typeof abc: function  -->
    <!--todo : typeof abc(): undefined because the function doesn't return anything  -->
    
    <!--? Example No 1  -->
    <script>
        function abc(){
            
            console.log("abc() called");
        }
        abc();
        console.log("typeof abc(): ", typeof abc());
        console.log("typeof abc: ", typeof abc);
    </script>

    <!--? Example No 2  -->

    <script>
        function xyz(){

            return "xyz() called";
        }
        xyz();
        console.log("typeof xyz(): ", typeof xyz());
        console.log("typeof xyz: ", typeof xyz);
    </script>
</body>
</html>
