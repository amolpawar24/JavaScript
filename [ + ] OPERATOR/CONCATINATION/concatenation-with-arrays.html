
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concatenation with Arrays</title>
</head>
<body>

    <h1>String Concatenation with Arrays</h1>

    <script>

        //! 1. String + Array
        //todo:- When an array is concatenated with a string,
        //todo:- JavaScript converts the array into a string.

        let fruits = ["Apple", "Banana", "Mango"];

        console.log("Fruits: " + fruits);
        // Output: "Fruits: Apple,Banana,Mango"


        //! 2. Array + String

        console.log(fruits + " are available");
        // Output: "Apple,Banana,Mango are available"


        //! 3. Array + Number

        let numbers = [10, 20, 30];

        console.log(numbers + 100);
        // Step 1: [10, 20, 30] becomes "10,20,30"
        // Step 2: "10,20,30" + 100
        // Output: "10,20,30100"


        //! 4. Number + Array

        console.log(100 + numbers);
        // Output: "10010,20,30"


        //! 5. Array + Array
        //todo:- Both arrays are converted into strings.
        //todo:- The resulting strings are concatenated.

        let firstArray = [10, 20];
        let secondArray = [30, 40];

        console.log(firstArray + secondArray);
        // Output: "10,2030,40"


        //! 6. Empty Array + String

        let emptyArray = [];

        console.log("Result: " + emptyArray);
        // Output: "Result: "


        //! 7. Array with Empty Elements

        let emptyElements = [10, , 30];

        console.log("Values: " + emptyElements);
        // Output: "Values: 10,,30"


        //! 8. Array with Null and Undefined

        let mixedArray = [10, null, undefined, 30];

        console.log("Values: " + mixedArray);
        // Output: "Values: 10,,,30"


        //! 9. Nested Arrays

        let nestedArray = [10, 20, [30, 40]];

        console.log("Nested: " + nestedArray);
        // Output: "Nested: 10,20,30,40"


        //! 10. Array with Boolean Values

        let booleanArray = [true, false, true];

        console.log("Boolean: " + booleanArray);
        // Output: "Boolean: true,false,true"


        //! 11. Array with String and Number

        let mixedValues = ["JavaScript", 100, "React"];

        console.log("Skills: " + mixedValues);
        // Output: "Skills: JavaScript,100,React"


        //! 12. Checking Data Types

        console.log(typeof fruits);
        // Output: "object"

        console.log(typeof (fruits + ""));
        // Output: "string"

        console.log(typeof (fruits + numbers));
        // Output: "string"


        //! 13. Explicit String Conversion

        console.log(String(fruits));
        // Output: "Apple,Banana,Mango"

        console.log(String([]));
        // Output: ""

        console.log(String([10, 20, 30]));
        // Output: "10,20,30"


        //! 14. Using toString()

        console.log(fruits.toString());
        // Output: "Apple,Banana,Mango"

        console.log(numbers.toString());
        // Output: "10,20,30"


        //! 15. Original Array Remains Unchanged

        let originalArray = [10, 20, 30];

        let result = "Numbers: " + originalArray;

        console.log(result);
        // Output: "Numbers: 10,20,30"

        console.log(originalArray);
        // Output: [10, 20, 30]

        console.log(Array.isArray(originalArray));
        // Output: true

    </script>

</body>
</html>
